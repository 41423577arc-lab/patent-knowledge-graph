name: Development baseline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  sample-checks:
    runs-on: ubuntu-latest
    env:
      USE_SAMPLE: "true"
      QA_BACKEND: "mock"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py core scripts pages analysis qa ui eval legacy
      - run: python -m eval.check_contracts
      - run: python -m eval.check_metrics
      - run: python -m eval.smoke_test
